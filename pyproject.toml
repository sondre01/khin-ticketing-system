[project]
name = "khin-ticketing-system"
version = "1.0.0"
description = "Khin Ticket - Multi-Department Ticketing System"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "psycopg2-binary==2.9.12",
    "bcrypt==4.1.3",
    "PyJWT==2.8.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9"
]

[tool.vercel]
entrypoint = "backend.main:app"
